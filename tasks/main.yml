---
- name: "unbound | Include pre requisite tasks"
  ansible.builtin.import_tasks:
    file: "pre_requisite.yml"
- name: "unbound | Include packages tasks"
  ansible.builtin.include_tasks:
    file: "packages.yml"
  when:
    - "lookup('ansible.builtin.vars', 'unbound', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'unbound') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'unbound_install_package', default='')) == 'true'"
  vars:
    unbound_install_package: "[] | map(&install_package || 'false', @) | [0]"
- name: "unbound | Include root hints tasks"
  ansible.builtin.import_tasks:
    file: "deploy.d/root_hints.yml"
- name: "unbound | Include deployment tasks"
  ansible.builtin.import_tasks:
    file: "deploy.d/unbound.yml"
